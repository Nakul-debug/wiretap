[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretap"
version = "0.1.0"
description = "Educational desktop network protocol analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "wiretap Team", email = "team@example.com"}
]

dependencies = [
    "scapy>=2.5.0",
    "PyQt6>=6.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
